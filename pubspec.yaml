name: railmate
description: "RailMate - Smart rail navigation and ticketing for Malaysia."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  provider: ^6.1.2
  http: ^1.2.2
  collection: ^1.19.0

  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0

  supabase_flutter: ^2.8.0

  geolocator: ^13.0.2
  flutter_local_notifications: ^18.0.1
  qr_flutter: ^4.1.0
  crypto: ^3.0.6

  # Live train map: shows real vehicle positions from data.gov.my's
  # GTFS-Realtime feed (see lib/data/services/live_train_service.dart).
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
